<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#edebe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tienda">
<title>LUXUR · Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#edebe6; --cream-dark:#E6E2DC; --rosa:#EECDCC; --rosa-deep:#C9868E;
  --black:#1C1C1C;--paper:#FBFAF7;--line:#BDBAB3;--ink-warm:#3A2E2E; --grey:#5A5A5A; --green:#5b9a5b; --red:#bd6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--cream);color:var(--black);font-family:'Poppins',sans-serif;font-weight:300;
  min-height:100dvh;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:430px;margin:0 auto;padding:30px 20px 40px;display:flex;flex-direction:column;gap:18px;min-height:100dvh}

.brand{font-family:'Montserrat',sans-serif;font-weight:600;font-size:24px;text-align:center;color:var(--rosa-deep)}
.tagline{font-family:'Poppins',sans-serif;font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--grey);text-align:center;margin-top:2px}

.q{font-family:'Poppins',sans-serif;font-weight:300;letter-spacing:-.02em;font-size:27px;text-align:center;line-height:1.15;margin-top:14px}

.card{background:var(--paper);border-radius:20px;padding:20px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  display:flex;flex-direction:column;gap:14px}
.lbl{font-family:'Poppins',sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}

.daychips{display:flex;gap:8px}
.dc{flex:1;border:1px solid rgba(0,0,0,.08);background:var(--paper);border-radius:999px;padding:11px 8px;
  font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:500;color:#555;cursor:pointer;text-align:center}
.dc.on{background:var(--rosa);border-color:transparent;color:var(--black);font-weight:600}
input[type=date]{border:1px solid rgba(0,0,0,.08);background:var(--paper);border-radius:14px;padding:13px 14px;
  font-family:'Poppins',sans-serif;font-size:16px;width:100%;color:var(--black)}

.numbox{display:flex;align-items:center;gap:10px}
.step{border:none;background:var(--cream);border-radius:16px;width:64px;height:74px;font-size:28px;
  font-weight:400;color:var(--black);cursor:pointer;flex:none;touch-action:manipulation}
.step:active{background:var(--cream-dark)}
input[type=number]{flex:1;min-width:0;border:none;background:transparent;text-align:center;
  font-family:'Poppins',sans-serif;font-weight:300;letter-spacing:-.02em;font-size:64px;color:var(--black);
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.prev{font-size:12.5px;color:var(--grey);text-align:center;min-height:18px}

.save{border:none;border-radius:999px;background:var(--black);color:var(--cream);width:100%;
  font-family:'Poppins',sans-serif;font-size:17px;font-weight:600;padding:18px;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.12);touch-action:manipulation}
.save:active{transform:scale(.98)}
.save:disabled{background:var(--cream-dark);color:#9a948e;box-shadow:none}
.save.ok{background:var(--green)}

.msg{font-family:'Poppins',sans-serif;font-weight:600;font-size:10px;letter-spacing:.06em;color:var(--grey);
  text-align:center;min-height:16px}
.msg.err{color:var(--red)}

.badpage{text-align:center;padding:80px 24px;font-size:15px;color:var(--grey)}

/* Meta del día (presupuesto de Juliana · venta POS de Shopify) */
.goal{gap:12px;background:radial-gradient(120% 140% at 100% 0%,rgba(238,205,204,.55) 0%,rgba(201,134,142,.18) 38%,rgba(28,28,28,0) 70%),linear-gradient(160deg,#2a2224 0%,#1C1C1C 60%);color:var(--cream);border-radius:24px}
.goal .lbl{color:rgba(237,235,230,.6)}
.goal-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ev{font-family:'Poppins',sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--rosa);color:var(--black);border-radius:999px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.goal-num{font-family:'Poppins',sans-serif;font-weight:300;letter-spacing:-.02em;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.goal-sub{font-size:13px;color:rgba(237,235,230,.65)}
.bar{height:10px;background:rgba(237,235,230,.14);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rosa);border-radius:999px;transition:width .4s}
.bar.done i{background:var(--green)}
.goal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gbox{background:rgba(237,235,230,.1);border-radius:16px;padding:12px}
.gbox b{display:block;font-family:'Poppins',sans-serif;font-weight:300;letter-spacing:-.02em;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.gbox span{font-size:12px;color:rgba(237,235,230,.65)}
.gbox.ok b{color:#9fd3a4}
.goal-month{font-size:12.5px;color:rgba(237,235,230,.65);border-top:1px solid rgba(237,235,230,.12);padding-top:10px}
.goal-month b{color:var(--cream);font-weight:600}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <div>
    <div class="brand">LUXUR</div>
    <div class="tagline">Tienda Medellín</div>
  </div>

  <div class="card goal" id="goalCard" hidden>
    <div class="goal-top">
      <span class="lbl" id="goalLbl">Meta de hoy</span>
      <span class="ev" id="goalEv" hidden></span>
    </div>
    <div>
      <div class="goal-num" id="goalNum">—</div>
      <div class="goal-sub" id="goalSub"></div>
    </div>
    <div class="bar" id="goalBar"><i id="goalFill" style="width:0%"></i></div>
    <div class="goal-row">
      <div class="gbox" id="boxSold"><b id="goalSold">—</b><span>vendido en caja</span></div>
      <div class="gbox" id="boxLeft"><b id="goalLeft">—</b><span id="goalLeftLbl">falta</span></div>
    </div>
    <div class="goal-month" id="goalMonth"></div>
  </div>

  <div class="q">¿Cuántas personas<br>entraron?</div>

  <div class="card">
    <span class="lbl">Día</span>
    <div class="daychips">
      <button class="dc on" id="chipHoy">Hoy</button>
      <button class="dc" id="chipAyer">Ayer</button>
      <button class="dc" id="chipOtro">Otro día</button>
    </div>
    <input type="date" id="dayInput" hidden>
  </div>

  <div class="card">
    <span class="lbl" id="numLbl">Personas ese día</span>
    <div class="numbox">
      <button class="step" id="minus">−</button>
      <input type="number" id="num" inputmode="numeric" min="0" max="9999" placeholder="0">
      <button class="step" id="plus">＋</button>
    </div>
    <div class="prev" id="prev"></div>
  </div>

  <button class="save" id="saveBtn">Guardar</button>
  <div class="msg" id="msg"></div>
</div>
<div class="badpage" id="badToken" hidden>
  Este link no es válido.<br>Pídele a Paulina el link de la tienda.
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL = "https://nrpgtlcdvtesjbxpkxha.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycGd0bGNkdnRlc2pieHBreGhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODkzNTAsImV4cCI6MjA5NDM2NTM1MH0.ntRHkFobaVK6RW9EYRwoww1ATr8N0zHMzXHM__5x8E0";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const token = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);

const bogotaISO = shift => {
  const d = new Date(Date.now() - 5*60*60*1000);
  d.setUTCDate(d.getUTCDate() + (shift || 0));
  return d.toISOString().slice(0,10);
};
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const bonito = iso => `${parseInt(iso.slice(8))} ${MES[parseInt(iso.slice(5,7))-1]}`;

let day = bogotaISO(0);

function init(){
  const di = $('dayInput');
  di.max = bogotaISO(0);
  di.value = day;
  $('numLbl').textContent = 'Personas hoy';
  loadDay();
  loadGoal();
}

function setDay(iso, chip){
  day = iso;
  ['chipHoy','chipAyer','chipOtro'].forEach(id => $(id).classList.toggle('on', id === chip));
  $('dayInput').hidden = (chip !== 'chipOtro');
  $('numLbl').textContent = day === bogotaISO(0) ? 'Personas hoy' : `Personas el ${bonito(day)}`;
  loadDay();
  loadGoal();
}

// ── Meta del día: presupuesto diario de la tienda vs venta neta del POS (sin IVA) ──
const cop = v => '$' + Math.round(v).toLocaleString('es-CO');
const mill = v => '$' + (v/1e6).toFixed(1).replace('.', ',') + ' M';
async function loadGoal(){
  try {
    const { data: g, error } = await supabase.rpc('store_get_goal', { p_token: token, p_day: day });
    if (error) throw error;
    if (!g || g.goal == null){ $('goalCard').hidden = true; return; }
    $('goalCard').hidden = false;
    const isToday = day === bogotaISO(0);
    $('goalLbl').textContent = isToday ? 'Meta de hoy' : `Meta del ${bonito(day)}`;
    $('goalEv').hidden = !g.event; $('goalEv').textContent = g.event || '';
    const goal = +g.goal, sold = +g.sold, left = goal - sold;
    $('goalNum').textContent = cop(goal);
    $('goalSub').textContent = g.ticket ? `unos ${Math.ceil(goal / g.ticket)} tickets de ${cop(g.ticket)}` : '';
    const pct = goal > 0 ? Math.min(100, sold / goal * 100) : 0;
    $('goalFill').style.width = pct.toFixed(0) + '%';
    $('goalBar').classList.toggle('done', left <= 0);
    $('goalSold').textContent = cop(sold);
    const upd = g.updated_at ? new Date(g.updated_at).toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Bogota' }) : null;
    $('boxSold').querySelector('span').textContent = `vendido en caja, ${g.orders} ticket${g.orders === 1 ? '' : 's'}` + (upd ? ` (${upd})` : '');
    if (left > 0){
      $('goalLeft').textContent = cop(left);
      $('goalLeftLbl').textContent = g.ticket ? `falta, ${Math.ceil(left / g.ticket)} tickets más` : 'falta';
      $('boxLeft').classList.remove('ok');
    } else {
      $('goalLeft').textContent = '+' + cop(-left);
      $('goalLeftLbl').textContent = 'meta cumplida';
      $('boxLeft').classList.add('ok');
    }
    if (g.month_goal_to_date){
      const c = g.month_sold / g.month_goal_to_date;
      $('goalMonth').innerHTML = `En el mes van <b>${mill(g.month_sold)}</b> de ${mill(g.month_goal_to_date)} a la fecha (${Math.round(c*100)} %). La meta del mes es ${mill(g.month_goal)}.`;
    }
  } catch (e) {
    $('goalCard').hidden = true;
  }
}
setInterval(() => { if (day === bogotaISO(0)) loadGoal(); }, 10 * 60 * 1000);

$('chipHoy').addEventListener('click', () => setDay(bogotaISO(0), 'chipHoy'));
$('chipAyer').addEventListener('click', () => setDay(bogotaISO(-1), 'chipAyer'));
$('chipOtro').addEventListener('click', () => { $('dayInput').hidden = false; setDay($('dayInput').value || bogotaISO(0), 'chipOtro'); });
$('dayInput').addEventListener('change', e => { if (e.target.value) setDay(e.target.value, 'chipOtro'); });

async function loadDay(){
  $('prev').textContent = '…';
  try {
    const { data, error } = await supabase.rpc('store_get_day', { p_token: token, p_day: day });
    if (error) throw error;
    if (data.saved){
      $('num').value = data.visitors;
      $('prev').textContent = `Ya había ${data.visitors} guardadas para ese día — si guardas, se reemplaza.`;
    } else {
      $('num').value = '';
      $('prev').textContent = 'Ese día no tiene nada guardado todavía.';
    }
  } catch (e) {
    $('prev').textContent = '';
    showMsg('sin señal — igual puedes escribir y guardar', true);
  }
}

$('plus').addEventListener('click', () => { $('num').value = Math.min(9999, (parseInt($('num').value)||0) + 1); });
$('minus').addEventListener('click', () => { $('num').value = Math.max(0, (parseInt($('num').value)||0) - 1); });

function showMsg(t, err){
  const m = $('msg');
  m.textContent = t;
  m.classList.toggle('err', !!err);
}

$('saveBtn').addEventListener('click', async () => {
  const v = parseInt($('num').value);
  if (isNaN(v) || v < 0){ showMsg('escribe la cantidad primero', true); $('num').focus(); return; }
  const btn = $('saveBtn');
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    const { data, error } = await supabase.rpc('store_set_day', { p_token: token, p_day: day, p_visitors: v });
    if (error) throw error;
    btn.disabled = false; btn.classList.add('ok');
    btn.textContent = `✓ Guardado: ${data.visitors} el ${bonito(day)}`;
    showMsg('');
    setTimeout(() => { btn.classList.remove('ok'); btn.textContent = 'Guardar'; }, 2600);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Guardar';
    showMsg('no se guardó — revisa la señal e intenta otra vez', true);
  }
});

// Arranque al final: antes se llamaba init() antes de declarar bogotaISO y la página fallaba al cargar
if (!/^[0-9a-f-]{36}$/.test(token)){
  $('badToken').hidden = false;
} else {
  $('app').hidden = false;
  init();
}
</script>
</body>
</html>
