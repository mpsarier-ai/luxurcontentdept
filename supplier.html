<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#edebe6">
<title>LUXUR · Producción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#edebe6; --cream-dark:#dedad3; --rosa:#f2d4d7; --rosa-deep:#d4848e;
  --black:#1a1a1a; --grey:#7a7570; --green:#5b9a5b; --red:#bd6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--cream);color:var(--black);font-family:'Outfit',sans-serif;font-weight:300;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.wrap{max-width:560px;margin:0 auto;padding:32px 18px 60px}

.brand{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:26px;letter-spacing:.05em;text-align:center;color:var(--rosa-deep);margin-bottom:4px}
.tagline{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);text-align:center;margin-bottom:8px}
.hi{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--black);text-align:center;margin-bottom:6px;line-height:1.2}
.count{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);text-align:center;margin-bottom:24px}

.card{background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);margin-bottom:14px;border-top:3px solid var(--cream-dark);transition:border-top-color .2s ease}
.card.done{border-top-color:var(--green);opacity:.85}
.card.active{border-top-color:var(--rosa-deep)}

.product-name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;line-height:1.15;color:var(--black);margin-bottom:6px}
.product-meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:var(--grey);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px}
.product-meta b{color:var(--black);font-weight:500}

.curve{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.curve-pill{background:rgba(212,132,142,.1);color:var(--rosa-deep);padding:4px 9px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.04em}

.stepper{display:flex;align-items:flex-start;justify-content:space-between;gap:0;margin:12px 0 10px;padding:8px 0}
.step{display:flex;flex-direction:column;align-items:center;flex:1;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.04em;color:var(--grey);text-transform:uppercase;text-align:center;gap:4px;position:relative;min-width:0}
.step-dot{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.12);flex-shrink:0;transition:all .2s ease}
.step.done .step-dot{background:var(--rosa-deep);border-color:var(--rosa-deep)}
.step.done .step-dot::after{content:'';display:block;width:6px;height:6px;background:#fff;border-radius:50%;margin:4px auto}
.step.current .step-dot{background:#fff;border-color:var(--rosa-deep);box-shadow:0 0 0 4px rgba(212,132,142,.15)}
.step-label{font-size:9px;line-height:1.2;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.done .step-label{color:var(--rosa-deep)}
.step.current .step-label{color:var(--black);font-weight:600}
.step-days{font-size:8.5px;color:var(--grey);text-transform:lowercase;letter-spacing:.02em}
.step.current .step-days{color:var(--rosa-deep);font-weight:500}
.step-line{flex:0 0 auto;height:2px;background:rgba(0,0,0,.08);align-self:flex-start;margin-top:8px;width:8px;flex:1;max-width:30px}
.step-line.done{background:var(--rosa-deep)}

.step-action{margin-top:14px;text-align:center}
.step-btn{background:var(--rosa-deep);color:#fff;border:none;padding:12px 22px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:999px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(212,132,142,.25);transition:transform .15s ease,box-shadow .15s ease}
.step-btn:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(0,0,0,.08),0 8px 18px rgba(212,132,142,.3)}
.step-btn:active{transform:translateY(0)}
.step-btn:disabled{opacity:.55;cursor:not-allowed}
.step-btn.complete{background:var(--green);box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(91,154,91,.25)}

.delivered{margin-top:10px;text-align:center;color:var(--green);font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;font-weight:500}

.notes{font-family:'Outfit',sans-serif;font-size:12px;color:#555;line-height:1.45;background:rgba(237,235,230,.6);padding:10px 12px;border-radius:10px;margin-top:8px}
.notes b{color:var(--black);font-weight:600}

.status-msg{padding:16px 20px;border-radius:14px;text-align:center;font-family:'Outfit',sans-serif;font-size:14px;margin-bottom:14px}
.status-msg.loading{color:var(--grey);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.status-msg.error{color:var(--red);background:rgba(189,107,107,.08);border:1px solid rgba(189,107,107,.2)}
.status-msg.success{color:var(--green);background:rgba(91,154,91,.08);border:1px solid rgba(91,154,91,.2)}

.empty{background:#fff;border-radius:18px;padding:32px;text-align:center;color:var(--grey);font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic}

.footer{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);text-align:center;margin-top:24px;line-height:1.6}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--black);color:var(--cream);padding:12px 22px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;opacity:0;transition:opacity .25s ease,transform .25s ease;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">LUXUR</div>
  <div class="tagline">Producción</div>
  <div id="root">
    <div class="status-msg loading">Cargando…</div>
  </div>
  <div class="footer">Marcá cada etapa cuando termines.<br>El equipo LUXUR recibe la actualización en vivo.</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://nrpgtlcdvtesjbxpkxha.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycGd0bGNkdnRlc2pieHBreGhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODkzNTAsImV4cCI6MjA5NDM2NTM1MH0.ntRHkFobaVK6RW9EYRwoww1ATr8N0zHMzXHM__5x8E0";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STAGES_FULL = [
  { key: 'corte',       short: 'Corte',  label: 'Corte' },
  { key: 'proceso',     short: 'Proc',   label: 'Proceso · bordado/estampado' },
  { key: 'confeccion',  short: 'Conf',   label: 'Confección' },
  { key: 'lavanderia',  short: 'Lavd',   label: 'Lavandería' },
  { key: 'terminacion', short: 'Term',   label: 'Terminación' },
  { key: 'entrega',     short: 'Entr',   label: 'Entrega' },
];

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function getToken(){
  const params = new URLSearchParams(location.search);
  let t = params.get('t') || params.get('token') || '';
  if (!t){
    const m = location.pathname.match(/\/[ps]\/([^/?#]+)/);
    if (m) t = decodeURIComponent(m[1]);
  }
  return t;
}
function getStages(hasProceso){ return hasProceso !== false ? STAGES_FULL : STAGES_FULL.filter(s => s.key !== 'proceso'); }
function firstHistory(history, key){
  if (!Array.isArray(history)) return null;
  for (let i = 0; i < history.length; i++) if (history[i].stage === key) return history[i];
  return null;
}
function daysBetween(a, b){
  if (!a || !b) return null;
  return Math.max(0, Math.round((new Date(b) - new Date(a)) / 86400000));
}
function fmtDateShort(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return `${d.getDate()} ${['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][d.getMonth()]}`;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function renderCard(entry, supplierToken){
  const stages = getStages(entry.has_proceso !== false);
  const lastDoneIdx = entry.stage ? stages.findIndex(s => s.key === entry.stage) : -1;
  const isFullyDone = lastDoneIdx === stages.length - 1;
  const currentIdx = lastDoneIdx + 1;
  // days per stage
  const startedAt = entry.created_at;
  const now = new Date().toISOString();
  let prevAt = startedAt;
  const stageDays = stages.map((s, i) => {
    const isDone = i <= lastDoneIdx;
    const isCurrent = !isFullyDone && i === currentIdx;
    const h = firstHistory(entry.stage_history, s.key);
    let d = null;
    if (isDone){
      d = daysBetween(prevAt, h && h.at);
      prevAt = (h && h.at) || prevAt;
    } else if (isCurrent){
      d = daysBetween(prevAt, now);
    }
    return d;
  });
  const totalDays = isFullyDone ? daysBetween(startedAt, firstHistory(entry.stage_history, 'entrega')?.at) : null;
  const curveStr = entry.size_curve && typeof entry.size_curve === 'object'
    ? Object.entries(entry.size_curve).filter(([_,v]) => v > 0).map(([k,v]) => `${k}·${v}`)
    : [];
  const entrega = entry.tentative_date ? fmtDateShort(entry.tentative_date + 'T12:00:00') : null;
  const cardCls = isFullyDone ? 'done' : 'active';
  const nextLabel = !isFullyDone && currentIdx < stages.length ? stages[currentIdx].label : '';
  const isLastStage = currentIdx === stages.length - 1;
  const nextKey = !isFullyDone ? stages[currentIdx].key : '';
  return `<div class="card ${cardCls}" data-id="${entry.id}">
    <div class="product-name">${escapeHtml(entry.product_name || 'Sin nombre')}</div>
    <div class="product-meta">
      ${entry.quantity ? `<span><b>${entry.quantity}u</b></span>` : ''}
      ${entrega ? `<span>📅 ${entrega}</span>` : ''}
      ${entry.entry_type ? `<span style="text-transform:capitalize">${escapeHtml(entry.entry_type)}</span>` : ''}
    </div>
    ${curveStr.length ? `<div class="curve">${curveStr.map(s => `<span class="curve-pill">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
    ${entry.notes ? `<div class="notes"><b>Nota:</b> ${escapeHtml(entry.notes)}</div>` : ''}
    <div class="stepper">
      ${stages.map((s, i) => {
        const isDone = i <= lastDoneIdx;
        const isCur = !isFullyDone && i === currentIdx;
        const cls = isDone ? 'done' : (isCur ? 'current' : '');
        const d = stageDays[i];
        const daysLbl = d != null ? `<span class="step-days">${d === 0 ? 'hoy' : `${d}d`}</span>` : '';
        let html = `<div class="step ${cls}"><span class="step-dot"></span><span class="step-label">${s.short}</span>${daysLbl}</div>`;
        if (i < stages.length - 1) html += `<span class="step-line ${i < lastDoneIdx ? 'done' : ''}"></span>`;
        return html;
      }).join('')}
    </div>
    ${isFullyDone ? `<div class="delivered">✓ Entregado${totalDays != null ? ` · en ${totalDays}d` : ''}</div>` :
      `<div class="step-action"><button class="step-btn ${isLastStage ? 'complete' : ''}" data-pid="${entry.id}" data-stage="${nextKey}" data-supplier="${supplierToken}">${isLastStage ? 'Confirmar entrega' : `${escapeHtml(nextLabel)} terminado`}</button></div>`}
  </div>`;
}

function render(payload, supplierToken){
  const root = document.getElementById('root');
  if (!payload || !payload.supplier){
    root.innerHTML = `<div class="status-msg error">Link inválido o expirado. Pediles a tu contacto que te mande uno nuevo.</div>`;
    return;
  }
  const supplier = payload.supplier;
  const items = Array.isArray(payload.items) ? payload.items : [];
  const inProgress = items.filter(i => !(i.stage === 'entrega'));
  const done = items.filter(i => i.stage === 'entrega');
  const greeting = supplier.name ? `Hola, ${supplier.name}` : 'Hola';
  let html = `<div class="hi">${escapeHtml(greeting)}</div>`;
  html += `<div class="count">${inProgress.length} ${inProgress.length === 1 ? 'jean' : 'jeans'} en producción${done.length ? ` · ${done.length} entregados` : ''}</div>`;
  if (items.length === 0){
    html += `<div class="empty">Sin productos asignados todavía</div>`;
  } else {
    html += inProgress.map(it => renderCard(it, supplierToken)).join('');
    if (done.length){
      html += `<div class="count" style="margin:24px 0 10px">Entregados</div>`;
      html += done.map(it => renderCard(it, supplierToken)).join('');
    }
  }
  root.innerHTML = html;
  // Wire buttons
  root.querySelectorAll('[data-pid]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const pid = btn.getAttribute('data-pid');
      const stage = btn.getAttribute('data-stage');
      const token = btn.getAttribute('data-supplier');
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Guardando…';
      try {
        let res;
        if (currentMode === 'legacy'){
          // Link viejo /p/{per_product_token} → RPC sin supplier
          res = await supabase.rpc('advance_stage_by_token', {
            p_token: token, p_new_stage: stage,
          });
        } else {
          res = await supabase.rpc('advance_supplier_stage', {
            p_token: token, p_pipeline_id: pid, p_new_stage: stage,
          });
        }
        if (res.error) throw res.error;
        showToast('✓ Etapa marcada');
        await refresh();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = original;
        showToast('Error: ' + (err.message || 'no pudo guardar'));
      }
    });
  });
}

let currentToken = '';
let currentMode = 'supplier'; // 'supplier' | 'legacy'

async function refresh(){
  if (!currentToken) return;
  try {
    if (currentMode === 'legacy'){
      const { data, error } = await supabase.rpc('get_pipeline_by_token', { p_token: currentToken });
      if (error) throw error;
      render({ supplier: { name: 'Proveedor' }, items: data ? [data] : [] }, currentToken);
    } else {
      const { data, error } = await supabase.rpc('get_supplier_pipeline_by_token', { p_token: currentToken });
      if (error) throw error;
      render(data, currentToken);
    }
  } catch (err) {
    document.getElementById('root').innerHTML = `<div class="status-msg error">Error: ${escapeHtml(err.message || 'no pudo cargar')}</div>`;
  }
}

async function init(){
  const token = getToken();
  if (!token){
    document.getElementById('root').innerHTML = `<div class="status-msg error">Falta el token en el link.</div>`;
    return;
  }
  currentToken = token;
  // Primero intentá vista multi-producto (link nuevo /s/{token})
  try {
    const { data, error } = await supabase.rpc('get_supplier_pipeline_by_token', { p_token: token });
    if (error) throw error;
    if (data && data.supplier){
      currentMode = 'supplier';
      render(data, token);
      return;
    }
  } catch (_) { /* cae al legacy */ }
  // Fallback: link viejo /p/{token} de un solo producto
  try {
    const { data, error } = await supabase.rpc('get_pipeline_by_token', { p_token: token });
    if (error) throw error;
    if (!data){
      document.getElementById('root').innerHTML = `<div class="status-msg error">Link inválido o expirado. Pediles a tu contacto que te mande uno nuevo.</div>`;
      return;
    }
    currentMode = 'legacy';
    render({ supplier: { name: 'Proveedor' }, items: [data] }, token);
  } catch (err) {
    document.getElementById('root').innerHTML = `<div class="status-msg error">Error: ${escapeHtml(err.message || 'no pudo cargar')}</div>`;
  }
}

init();
</script>

</body>
</html>
