<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#edebe6">
<title>LUXUR · Producción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#edebe6; --cream-dark:#dedad3; --rosa:#f2d4d7; --rosa-deep:#d4848e;
  --black:#1a1a1a; --grey:#7a7570; --green:#5b9a5b; --red:#bd6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--cream);color:var(--black);font-family:'Outfit',sans-serif;font-weight:300;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.wrap{max-width:560px;margin:0 auto;padding:32px 18px 60px}

.brand{font-family:'Montserrat',sans-serif;font-weight:600;font-size:26px;letter-spacing:normal;text-align:center;color:var(--rosa-deep);margin-bottom:4px}
.tagline{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);text-align:center;margin-bottom:8px}
.hi{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--black);text-align:center;margin-bottom:6px;line-height:1.2}
.count{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);text-align:center;margin-bottom:24px}
.total-units{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0 8px;flex-wrap:wrap}
.tu-num{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:42px;line-height:1;color:var(--rosa-deep)}
.tu-unit{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);font-weight:500}
.tu-label{font-family:'Outfit',sans-serif;font-size:13px;color:#555;font-style:italic}

.card{background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);margin-bottom:14px;border-top:3px solid var(--cream-dark);transition:border-top-color .2s ease}
.card.done{border-top-color:var(--green);opacity:.85}
.card.active{border-top-color:var(--rosa-deep)}

/* Lote (batch) — card grande con sub-cards de variantes adentro */
.batch{background:#fff;border-radius:20px;padding:20px 18px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 22px rgba(0,0,0,.06);margin-bottom:18px;border-top:3px solid var(--rosa-deep)}
.batch.batch-done{border-top-color:var(--green);opacity:.92}
.batch-name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;line-height:1.15;color:var(--black);margin-bottom:4px}
.batch-name::before{content:'LOTE · ';font-family:'JetBrains Mono',monospace;font-size:9px;font-style:normal;font-weight:500;letter-spacing:.18em;color:var(--rosa-deep);vertical-align:middle;margin-right:6px}
.batch-msg{font-family:'Outfit',sans-serif;font-size:12px;color:var(--green);background:rgba(91,154,91,.08);padding:8px 12px;border-radius:10px;margin:10px 0 4px;text-align:center;font-style:italic}

.variants-head{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);margin:16px 0 8px}
.variant{background:rgba(237,235,230,.55);border-radius:14px;padding:14px 14px 12px;margin-bottom:10px;border-left:3px solid var(--cream-dark);transition:border-left-color .2s ease}
.variant.active{border-left-color:var(--rosa-deep);background:#fff}
.variant.done{border-left-color:var(--green);opacity:.85}
.variant-name{font-family:'Outfit',sans-serif;font-weight:600;font-size:15px;color:var(--black);margin-bottom:4px}
.variant-name::before{content:'↳ ';color:var(--rosa-deep);font-weight:400}
.variant-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--grey);letter-spacing:.04em;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:8px}
.variant-meta b{color:var(--black);font-weight:500}
.variant-stepper{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0}
.variant-step{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--grey);text-transform:uppercase}
.variant-step.done{color:var(--rosa-deep);font-weight:500}
.variant-step.current{color:var(--black);font-weight:600}
.variant-step-dot{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.15)}
.variant-step.done .variant-step-dot{background:var(--rosa-deep);border-color:var(--rosa-deep)}
.variant-step.current .variant-step-dot{border-color:var(--rosa-deep);box-shadow:0 0 0 3px rgba(212,132,142,.15)}
.variant-step-line{width:18px;height:2px;background:rgba(0,0,0,.08)}
.variant-step-line.done{background:var(--rosa-deep)}
.variant-action{text-align:center;margin-top:8px}
.variant-btn{background:var(--rosa-deep);color:#fff;border:none;padding:10px 18px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:999px;font-weight:500}
.variant-btn:disabled{background:var(--cream-dark);color:var(--grey);cursor:not-allowed}
.variant-btn.complete{background:var(--green)}
.variant-delivered{color:var(--green);font-family:'Cormorant Garamond',serif;font-size:14px;font-style:italic;text-align:center;font-weight:500;padding:4px 0}

.product-name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;line-height:1.15;color:var(--black);margin-bottom:6px}
.product-meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:var(--grey);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px}
.product-meta b{color:var(--black);font-weight:500}

.curve{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.curve-pill{background:rgba(212,132,142,.1);color:var(--rosa-deep);padding:4px 9px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.04em}

.stepper{display:flex;align-items:flex-start;justify-content:space-between;gap:0;margin:12px 0 10px;padding:8px 0}
.step{display:flex;flex-direction:column;align-items:center;flex:1;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.04em;color:var(--grey);text-transform:uppercase;text-align:center;gap:4px;position:relative;min-width:0}
.step-dot{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.12);flex-shrink:0;transition:all .2s ease}
.step.done .step-dot{background:var(--rosa-deep);border-color:var(--rosa-deep)}
.step.done .step-dot::after{content:'';display:block;width:6px;height:6px;background:#fff;border-radius:50%;margin:4px auto}
.step.current .step-dot{background:#fff;border-color:var(--rosa-deep);box-shadow:0 0 0 4px rgba(212,132,142,.15)}
.step-label{font-size:9px;line-height:1.2;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.done .step-label{color:var(--rosa-deep)}
.step.current .step-label{color:var(--black);font-weight:600}
.step-days{font-size:8.5px;color:var(--grey);text-transform:lowercase;letter-spacing:.02em}
.step.current .step-days{color:var(--rosa-deep);font-weight:500}
.step-line{flex:0 0 auto;height:2px;background:rgba(0,0,0,.08);align-self:flex-start;margin-top:8px;width:8px;flex:1;max-width:30px}
.step-line.done{background:var(--rosa-deep)}

.step-action{margin-top:14px;text-align:center}
.step-btn{background:var(--rosa-deep);color:#fff;border:none;padding:12px 22px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:999px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(212,132,142,.25);transition:transform .15s ease,box-shadow .15s ease}
.step-btn:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(0,0,0,.08),0 8px 18px rgba(212,132,142,.3)}
.step-btn:active{transform:translateY(0)}
.step-btn:disabled{opacity:.55;cursor:not-allowed}
.step-btn.complete{background:var(--green);box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(91,154,91,.25)}

.delivered{margin-top:10px;text-align:center;color:var(--green);font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;font-weight:500}

.notes{font-family:'Outfit',sans-serif;font-size:12px;color:#555;line-height:1.45;background:rgba(237,235,230,.6);padding:10px 12px;border-radius:10px;margin-top:8px}
.notes b{color:var(--black);font-weight:600}

.status-msg{padding:16px 20px;border-radius:14px;text-align:center;font-family:'Outfit',sans-serif;font-size:14px;margin-bottom:14px}
.status-msg.loading{color:var(--grey);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.status-msg.error{color:var(--red);background:rgba(189,107,107,.08);border:1px solid rgba(189,107,107,.2)}
.status-msg.success{color:var(--green);background:rgba(91,154,91,.08);border:1px solid rgba(91,154,91,.2)}

.empty{background:#fff;border-radius:18px;padding:32px;text-align:center;color:var(--grey);font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic}

.footer{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);text-align:center;margin-top:24px;line-height:1.6}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--black);color:var(--cream);padding:12px 22px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;opacity:0;transition:opacity .25s ease,transform .25s ease;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
/* ═══════════ APPLE THEME v2 ═══════════ */
*{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',system-ui,'Helvetica Neue',sans-serif !important;font-style:normal !important}
.brand{font-family:'Montserrat',sans-serif !important;font-weight:600 !important}
html,body{background:#edebe6}
.tagline{letter-spacing:.08em;color:#8e8e93;font-weight:500}
.hi{font-weight:700;letter-spacing:-.02em;font-size:24px}
.count{letter-spacing:.02em;text-transform:none;font-weight:500}
.product-name,.batch-name{font-weight:700;letter-spacing:-.01em}
.batch-name::before{letter-spacing:.1em}
.tu-num{font-weight:800;letter-spacing:-.03em}
.tu-unit{letter-spacing:.02em}
.step-name,.variant-name{font-weight:600}
.step-btn,.variant-btn{letter-spacing:0;text-transform:none;font-weight:600;font-size:13px}
.card,.batch{box-shadow:0 1px 3px rgba(0,0,0,.05)}
.delivered,.variant-delivered{font-weight:600}
.footer{letter-spacing:.02em;text-transform:none;color:#aeaeb2}
/* Rediseño simple: foto + barra de progreso + un botón grande */
.prow{display:flex;gap:12px;align-items:flex-start}
.prow .pbody{flex:1;min-width:0}
.pph{width:64px;height:84px;border-radius:12px;background:#f2f2f0 center/cover no-repeat;flex:none}
.pph.sm{width:52px;height:68px;border-radius:10px}
.pbar{height:7px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden;margin:12px 0 7px}
.pbar i{display:block;height:100%;background:var(--rosa-deep);border-radius:4px;transition:width .3s ease}
.pbar.full i{background:var(--green)}
.pstate{font-size:13.5px;font-weight:600}
.pstate small{color:#8e8e93;font-weight:500;font-size:12px}
.step-btn{width:100%;padding:15px 20px;border-radius:14px;font-size:15px !important}
.variant-btn{width:100%;padding:13px 18px;border-radius:12px;font-size:14px !important}
.vstate-chip{display:inline-block;background:var(--cream);border-radius:999px;padding:4px 12px;font-size:11px;font-weight:600;margin-top:2px}
.vstate-chip.ok{background:rgba(91,154,91,.12);color:var(--green)}
.revert-row{text-align:center;margin-top:10px}
.revert-btn{background:transparent;border:none;color:#8e8e93;font-size:12px;font-weight:500;text-decoration:underline;cursor:pointer;padding:6px 10px}
.revert-btn:active{opacity:.6}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">LUXUR</div>
  <div class="tagline">Producción</div>
  <div id="root">
    <div class="status-msg loading">Cargando…</div>
  </div>
  <div class="footer">Marcá cada etapa cuando termines.<br>El equipo LUXUR recibe la actualización en vivo.</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://nrpgtlcdvtesjbxpkxha.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycGd0bGNkdnRlc2pieHBreGhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODkzNTAsImV4cCI6MjA5NDM2NTM1MH0.ntRHkFobaVK6RW9EYRwoww1ATr8N0zHMzXHM__5x8E0";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STAGES_FULL = [
  { key: 'corte',       short: 'Corte',  label: 'Corte' },
  { key: 'proceso',     short: 'Proc',   label: 'Proceso · bordado/estampado' },
  { key: 'confeccion',  short: 'Conf',   label: 'Confección' },
  { key: 'lavanderia',  short: 'Lavd',   label: 'Lavandería' },
  { key: 'terminacion', short: 'Term',   label: 'Terminación' },
  { key: 'entrega',     short: 'Entr',   label: 'Entrega' },
];
// Flujo simple (proveedor tipo AXSPEN): Planeado → Pagado → Entregado → Terminación → Listo
// (key terminal 'entrega' para compat con la lógica de completado)
const STAGES_SIMPLE = [
  { key: 'planeado',    short: 'Plan',   label: 'Planeado' },
  { key: 'pagado',      short: 'Pagado', label: 'Pagado' },
  { key: 'entregado',   short: 'Entreg', label: 'Entregado' },
  { key: 'terminacion', short: 'Term',   label: 'Terminación' },
  { key: 'entrega',     short: 'Listo',  label: 'Listo' },
];
let supplierFlowType = 'full'; // se setea al render con payload.supplier.flow_type
// Etapas a nivel LOTE (hasta lavandería)
const BATCH_STAGES_FULL = STAGES_FULL.slice(0, 4); // corte, proceso, confeccion, lavanderia
// Etapas a nivel VARIANTE (después de lavandería)
const VARIANT_STAGES = STAGES_FULL.slice(4); // terminacion, entrega

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function getToken(){
  const params = new URLSearchParams(location.search);
  let t = params.get('t') || params.get('token') || '';
  if (!t){
    const m = location.pathname.match(/\/[ps]\/([^/?#]+)/);
    if (m) t = decodeURIComponent(m[1]);
  }
  return t;
}
function getStages(hasProceso){
  if (supplierFlowType === 'simple') return STAGES_SIMPLE;
  return hasProceso !== false ? STAGES_FULL : STAGES_FULL.filter(s => s.key !== 'proceso');
}
function firstHistory(history, key){
  if (!Array.isArray(history)) return null;
  for (let i = 0; i < history.length; i++) if (history[i].stage === key) return history[i];
  return null;
}
function daysBetween(a, b){
  if (!a || !b) return null;
  return Math.max(0, Math.round((new Date(b) - new Date(a)) / 86400000));
}
function fmtDateShort(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return `${d.getDate()} ${['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][d.getMonth()]}`;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function renderCard(entry, supplierToken){
  const stages = getStages(entry.has_proceso !== false);
  const lastDoneIdx = entry.stage ? stages.findIndex(s => s.key === entry.stage) : -1;
  const isFullyDone = lastDoneIdx === stages.length - 1;
  const currentIdx = lastDoneIdx + 1;
  // days per stage
  const startedAt = entry.created_at;
  const now = new Date().toISOString();
  let prevAt = startedAt;
  const stageDays = stages.map((s, i) => {
    const isDone = i <= lastDoneIdx;
    const isCurrent = !isFullyDone && i === currentIdx;
    const h = firstHistory(entry.stage_history, s.key);
    let d = null;
    if (isDone){
      d = daysBetween(prevAt, h && h.at);
      prevAt = (h && h.at) || prevAt;
    } else if (isCurrent){
      d = daysBetween(prevAt, now);
    }
    return d;
  });
  const totalDays = isFullyDone ? daysBetween(startedAt, firstHistory(entry.stage_history, 'entrega')?.at) : null;
  const curveStr = entry.size_curve && typeof entry.size_curve === 'object'
    ? Object.entries(entry.size_curve).filter(([_,v]) => v > 0).map(([k,v]) => `${k}·${v}`)
    : [];
  const entrega = entry.tentative_date ? fmtDateShort(entry.tentative_date + 'T12:00:00') : null;
  const cardCls = isFullyDone ? 'done' : 'active';
  const nextLabel = !isFullyDone && currentIdx < stages.length ? stages[currentIdx].label : '';
  const isLastStage = currentIdx === stages.length - 1;
  const nextKey = !isFullyDone ? stages[currentIdx].key : '';
  const curDays = !isFullyDone ? stageDays[currentIdx] : null;
  const pct = Math.round(((lastDoneIdx + 1) / stages.length) * 100);
  return `<div class="card ${cardCls}" data-id="${entry.id}">
    <div class="prow">
      ${entry.photo_url ? `<div class="pph" style="background-image:url('${escapeHtml(entry.photo_url)}')"></div>` : ''}
      <div class="pbody">
        <div class="product-name" style="font-size:18px">${escapeHtml(entry.product_name || 'Sin nombre')}</div>
        <div class="product-meta">
          ${entry.quantity ? `<span><b>${entry.quantity}u</b></span>` : ''}
          ${entrega ? `<span>📅 ${entrega}</span>` : ''}
        </div>
        ${curveStr.length ? `<div class="curve">${curveStr.map(s => `<span class="curve-pill">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
      </div>
    </div>
    ${entry.notes ? `<div class="notes"><b>Nota:</b> ${escapeHtml(entry.notes)}</div>` : ''}
    <div class="pbar ${isFullyDone ? 'full' : ''}"><i style="width:${pct}%"></i></div>
    ${isFullyDone
      ? `<div class="delivered">✓ Entregado${totalDays != null ? ` · en ${totalDays}d` : ''}</div>`
      : `<div class="pstate">Va en: <b>${escapeHtml(stages[currentIdx].label.split(' · ')[0])}</b> <small>· etapa ${currentIdx + 1} de ${stages.length}${curDays != null ? ` · lleva ${curDays === 0 ? 'hoy' : curDays + 'd'}` : ''}</small></div>
         <div class="step-action"><button class="step-btn ${isLastStage ? 'complete' : ''}" data-pid="${entry.id}" data-stage="${nextKey}" data-supplier="${supplierToken}">✓ Ya terminamos ${escapeHtml(nextLabel.split(' · ')[0])}</button></div>`}
    ${lastDoneIdx >= 0 ? `<div class="revert-row"><button class="revert-btn" data-revert-pid="${entry.id}" data-revert-stage="${lastDoneIdx > 0 ? stages[lastDoneIdx-1].key : 'none'}" data-supplier="${supplierToken}">↩ Me equivoqué · desmarcar última etapa</button></div>` : ''}
  </div>`;
}

function renderBatch(batch, variants, supplierToken){
  const batchStages = supplierFlowType === 'simple'
    ? STAGES_SIMPLE
    : (batch.has_proceso !== false ? BATCH_STAGES_FULL : BATCH_STAGES_FULL.filter(s => s.key !== 'proceso'));
  const lastBatchIdx = batch.batch_stage ? batchStages.findIndex(s => s.key === batch.batch_stage) : -1;
  const batchDoneFully = lastBatchIdx === batchStages.length - 1;
  const batchCurrentIdx = lastBatchIdx + 1;
  // Days per batch stage
  const startedAt = batch.created_at;
  const now = new Date().toISOString();
  let prevAt = startedAt;
  const batchDays = batchStages.map((s, i) => {
    const isDone = i <= lastBatchIdx;
    const isCurrent = !batchDoneFully && i === batchCurrentIdx;
    const h = firstHistory(batch.batch_stage_history, s.key);
    let d = null;
    if (isDone){
      d = daysBetween(prevAt, h && h.at);
      prevAt = (h && h.at) || prevAt;
    } else if (isCurrent){
      d = daysBetween(prevAt, now);
    }
    return d;
  });
  const entrega = batch.tentative_date ? fmtDateShort(batch.tentative_date + 'T12:00:00') : null;
  const allVariantsDone = variants.length > 0 && variants.every(v => v.stage === 'entrega');
  const cardCls = allVariantsDone && batchDoneFully ? 'batch-done' : '';
  const nextBatchStage = !batchDoneFully && batchCurrentIdx < batchStages.length ? batchStages[batchCurrentIdx] : null;

  let html = `<div class="batch ${cardCls}" data-batch-id="${batch.id}">
    <div class="batch-name">${escapeHtml(batch.name || 'Lote sin nombre')}</div>
    <div class="product-meta">
      ${batch.total_quantity ? `<span><b>${batch.total_quantity}u</b> totales</span>` : ''}
      ${entrega ? `<span>📅 entrega ${entrega}</span>` : ''}
      ${variants.length ? `<span><b>${variants.length}</b> ${variants.length === 1 ? 'variante' : 'variantes'}</span>` : ''}
    </div>
    ${batch.notes ? `<div class="notes"><b>Nota:</b> ${escapeHtml(batch.notes)}</div>` : ''}

    ${(() => {
      const pct = Math.round(((lastBatchIdx + 1) / batchStages.length) * 100);
      const curDays = !batchDoneFully ? batchDays[batchCurrentIdx] : null;
      return `<div class="pbar ${batchDoneFully ? 'full' : ''}"><i style="width:${pct}%"></i></div>
      ${!batchDoneFully ? `<div class="pstate">El lote va en: <b>${escapeHtml(nextBatchStage.label.split(' · ')[0])}</b> <small>· etapa ${batchCurrentIdx + 1} de ${batchStages.length}${curDays != null ? ` · lleva ${curDays === 0 ? 'hoy' : curDays + 'd'}` : ''}</small></div>` : ''}`;
    })()}

    ${nextBatchStage ? `<div class="step-action">
      <button class="step-btn" data-batch-advance="${batch.id}" data-stage="${nextBatchStage.key}" data-supplier="${supplierToken}">✓ Ya terminamos ${escapeHtml(nextBatchStage.label.split(' · ')[0])}</button>
    </div>` : `<div class="batch-msg">${supplierFlowType === 'simple' ? '✓ Listo · producción completa' : '✓ Lote completo hasta Lavandería · ahora marca cada diseño abajo'}</div>`}
    ${lastBatchIdx >= 0 ? `<div class="revert-row"><button class="revert-btn" data-revert-batch="${batch.id}" data-revert-stage="${lastBatchIdx > 0 ? batchStages[lastBatchIdx-1].key : 'none'}" data-supplier="${supplierToken}">↩ Me equivoqué · desmarcar última etapa</button></div>` : ''}
  `;

  // Variants section
  if (variants.length){
    html += `<div class="variants-head">Variantes de diseño</div>`;
    html += variants.map(v => renderVariant(v, batch, batchDoneFully, supplierToken)).join('');
  }

  html += `</div>`;
  return html;
}

function renderVariant(v, batch, batchReadyForVariants, supplierToken){
  // Variantes solo tienen 2 etapas: Terminación + Entrega
  // Habilitadas solo cuando batch_stage = 'lavanderia' (batchReadyForVariants)
  const stages = VARIANT_STAGES; // terminacion, entrega
  // v.stage puede ser null (terminación en curso), 'terminacion' (terminación hecha, entrega en curso), 'entrega' (todo hecho)
  const lastDoneIdx = v.stage ? stages.findIndex(s => s.key === v.stage) : -1;
  const isFullyDone = lastDoneIdx === stages.length - 1;
  const currentIdx = lastDoneIdx + 1;
  const curveStr = v.size_curve && typeof v.size_curve === 'object'
    ? Object.entries(v.size_curve).filter(([_,v]) => v > 0).map(([k,n]) => `${k}·${n}`)
    : [];
  const cls = isFullyDone ? 'done' : (batchReadyForVariants ? 'active' : '');
  const designName = v.design_name || v.product_name || 'Variante';
  let actionHtml = '';
  if (isFullyDone){
    actionHtml = `<div class="variant-delivered">✓ Entregado</div>`;
  } else if (!batchReadyForVariants){
    actionHtml = '';
  } else {
    const nextStage = stages[currentIdx];
    const isLast = currentIdx === stages.length - 1;
    actionHtml = `<div class="variant-action"><button class="variant-btn ${isLast ? 'complete' : ''}" data-pid="${v.id}" data-stage="${nextStage.key}" data-supplier="${supplierToken}">${isLast ? '✓ Confirmar ENTREGA' : `✓ Ya terminamos ${escapeHtml(nextStage.label)}`}</button></div>`;
  }
  const stateChip = isFullyDone
    ? '<span class="vstate-chip ok">✓ Entregado</span>'
    : !batchReadyForVariants
      ? '<span class="vstate-chip">Esperando el lote</span>'
      : `<span class="vstate-chip">Va en: ${escapeHtml(stages[currentIdx].label)}</span>`;
  return `<div class="variant ${cls}" data-id="${v.id}">
    <div class="prow">
      ${v.photo_url ? `<div class="pph sm" style="background-image:url('${escapeHtml(v.photo_url)}')"></div>` : ''}
      <div class="pbody">
        <div class="variant-name">${escapeHtml(designName)}</div>
        <div class="variant-meta">
          ${v.quantity ? `<span><b>${v.quantity}u</b></span>` : ''}
          ${curveStr.length ? `<span>${curveStr.join(' · ')}</span>` : ''}
        </div>
        ${stateChip}
      </div>
    </div>
    ${actionHtml}
  </div>`;
}

function render(payload, supplierToken){
  const root = document.getElementById('root');
  if (!payload || !payload.supplier){
    root.innerHTML = `<div class="status-msg error">Link inválido o expirado. Pediles a tu contacto que te mande uno nuevo.</div>`;
    return;
  }
  const supplier = payload.supplier;
  supplierFlowType = supplier.flow_type === 'simple' ? 'simple' : 'full';
  // Soportá los 3 formatos: nuevo (batches+standalone), viejo (items), legacy single
  const batches = Array.isArray(payload.batches) ? payload.batches : [];
  const standalone = Array.isArray(payload.standalone) ? payload.standalone
                   : Array.isArray(payload.items) ? payload.items : [];
  const standaloneInProgress = standalone.filter(i => !(i.stage === 'entrega'));
  const standaloneDone = standalone.filter(i => i.stage === 'entrega');
  const greeting = supplier.name ? `Hola, ${supplier.name}` : 'Hola';
  const totalInProgress = batches.length + standaloneInProgress.length;

  // Total de unidades por entregar
  let batchUnits = 0, standaloneUnits = 0;
  batches.forEach(b => {
    const vars = Array.isArray(b.variants) ? b.variants : [];
    const allDelivered = vars.length > 0 && vars.every(v => v.stage === 'entrega');
    if (!allDelivered) batchUnits += (b.batch.total_quantity || 0);
  });
  standaloneInProgress.forEach(e => { standaloneUnits += (e.quantity || 0); });
  const totalUnits = batchUnits + standaloneUnits;

  let html = `<div class="hi">${escapeHtml(greeting)}</div>`;
  if (totalUnits > 0){
    html += `<div class="total-units"><span class="tu-num">${totalUnits.toLocaleString('es-CO')}</span><span class="tu-unit">unds</span><span class="tu-label">por entregar</span></div>`;
  }
  html += `<div class="count">${batches.length ? `${batches.length} ${batches.length === 1 ? 'lote' : 'lotes'}` : ''}${batches.length && standaloneInProgress.length ? ' · ' : ''}${standaloneInProgress.length ? `${standaloneInProgress.length} ${standaloneInProgress.length === 1 ? 'jean' : 'jeans'} sueltos` : ''}${totalInProgress === 0 ? 'Sin producción activa' : ''}</div>`;
  if (batches.length === 0 && standalone.length === 0){
    html += `<div class="empty">Sin productos asignados todavía</div>`;
  } else {
    // Render batches primero
    html += batches.map(b => renderBatch(b.batch, b.variants || [], supplierToken)).join('');
    // Después standalone en curso
    if (standaloneInProgress.length){
      if (batches.length) html += `<div class="variants-head" style="margin-top:24px">Jeans sueltos</div>`;
      html += standaloneInProgress.map(it => renderCard(it, supplierToken)).join('');
    }
    // Entregados al final
    if (standaloneDone.length){
      html += `<div class="count" style="margin:24px 0 10px">Entregados</div>`;
      html += standaloneDone.map(it => renderCard(it, supplierToken)).join('');
    }
  }
  root.innerHTML = html;
  // Wire buttons de variantes / standalone
  root.querySelectorAll('[data-pid]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const pid = btn.getAttribute('data-pid');
      const stage = btn.getAttribute('data-stage');
      const token = btn.getAttribute('data-supplier');
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Guardando…';
      try {
        let res;
        if (currentMode === 'legacy'){
          res = await supabase.rpc('advance_stage_by_token', { p_token: token, p_new_stage: stage });
        } else {
          res = await supabase.rpc('advance_supplier_stage', { p_token: token, p_pipeline_id: pid, p_new_stage: stage });
        }
        if (res.error) throw res.error;
        showToast('✓ Etapa marcada');
        await refresh();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = original;
        showToast('Error: ' + (err.message || 'no pudo guardar'));
      }
    });
  });
  // Botones "Me equivoqué" — retroceden una etapa
  root.querySelectorAll('[data-revert-pid]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('¿Desmarcar la última etapa? Vuelve un paso atrás.')) return;
      btn.disabled = true;
      const pid = btn.getAttribute('data-revert-pid');
      const stage = btn.getAttribute('data-revert-stage');
      const token = btn.getAttribute('data-supplier');
      try {
        let res;
        if (currentMode === 'legacy'){
          res = await supabase.rpc('advance_stage_by_token', { p_token: token, p_new_stage: stage });
        } else {
          res = await supabase.rpc('advance_supplier_stage', { p_token: token, p_pipeline_id: pid, p_new_stage: stage });
        }
        if (res.error) throw res.error;
        showToast('↩ Etapa corregida');
        await refresh();
      } catch (err) { btn.disabled = false; showToast('Error: ' + (err.message || 'no pudo guardar')); }
    });
  });
  root.querySelectorAll('[data-revert-batch]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('¿Desmarcar la última etapa del lote? Vuelve un paso atrás.')) return;
      btn.disabled = true;
      const batchId = btn.getAttribute('data-revert-batch');
      const stage = btn.getAttribute('data-revert-stage');
      const token = btn.getAttribute('data-supplier');
      try {
        const { error } = await supabase.rpc('advance_batch_stage', { p_token: token, p_batch_id: batchId, p_new_stage: stage });
        if (error) throw error;
        showToast('↩ Etapa corregida');
        await refresh();
      } catch (err) { btn.disabled = false; showToast('Error: ' + (err.message || 'no pudo guardar')); }
    });
  });
  // Wire buttons de LOTE (etapas tempranas Corte→Lavandería)
  root.querySelectorAll('[data-batch-advance]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const batchId = btn.getAttribute('data-batch-advance');
      const stage = btn.getAttribute('data-stage');
      const token = btn.getAttribute('data-supplier');
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Guardando…';
      try {
        const { error } = await supabase.rpc('advance_batch_stage', {
          p_token: token, p_batch_id: batchId, p_new_stage: stage,
        });
        if (error) throw error;
        showToast('✓ Lote actualizado');
        await refresh();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = original;
        showToast('Error: ' + (err.message || 'no pudo guardar'));
      }
    });
  });
}

let currentToken = '';
let currentMode = 'supplier'; // 'supplier' | 'legacy'

async function refresh(){
  if (!currentToken) return;
  try {
    if (currentMode === 'legacy'){
      const { data, error } = await supabase.rpc('get_pipeline_by_token', { p_token: currentToken });
      if (error) throw error;
      render({ supplier: { name: 'Proveedor' }, items: data ? [data] : [] }, currentToken);
    } else {
      const { data, error } = await supabase.rpc('get_supplier_pipeline_by_token', { p_token: currentToken });
      if (error) throw error;
      render(data, currentToken);
    }
  } catch (err) {
    document.getElementById('root').innerHTML = `<div class="status-msg error">Error: ${escapeHtml(err.message || 'no pudo cargar')}</div>`;
  }
}

async function init(){
  const token = getToken();
  if (!token){
    document.getElementById('root').innerHTML = `<div class="status-msg error">Falta el token en el link.</div>`;
    return;
  }
  currentToken = token;
  // Primero intentá vista multi-producto (link nuevo /s/{token})
  try {
    const { data, error } = await supabase.rpc('get_supplier_pipeline_by_token', { p_token: token });
    if (error) throw error;
    if (data && data.supplier){
      currentMode = 'supplier';
      render(data, token);
      return;
    }
  } catch (_) { /* cae al legacy */ }
  // Fallback: link viejo /p/{token} de un solo producto
  try {
    const { data, error } = await supabase.rpc('get_pipeline_by_token', { p_token: token });
    if (error) throw error;
    if (!data){
      document.getElementById('root').innerHTML = `<div class="status-msg error">Link inválido o expirado. Pediles a tu contacto que te mande uno nuevo.</div>`;
      return;
    }
    currentMode = 'legacy';
    render({ supplier: { name: 'Proveedor' }, items: [data] }, token);
  } catch (err) {
    document.getElementById('root').innerHTML = `<div class="status-msg error">Error: ${escapeHtml(err.message || 'no pudo cargar')}</div>`;
  }
}

init();
</script>
