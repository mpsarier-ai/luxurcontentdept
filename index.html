<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXUR — Content Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;0,900;1,400&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#edebe6;--cream-dark:#dedad3;--rosa:#f2d4d7;--rosa-deep:#d4848e;--black:#1a1a1a;--grey:#7a7570}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--black);font-family:'Outfit',sans-serif;font-weight:300;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:1100px;margin:0 auto;padding:80px 32px;flex:1;width:100%}
header{border-bottom:1px solid var(--black);padding-bottom:24px;margin-bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.logo{font-family:'Cormorant Garamond',serif;font-weight:900;font-size:48px;letter-spacing:.18em;line-height:1}
.tagline{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);margin-top:8px}
.year{font-family:'Cormorant Garamond',serif;font-weight:700;font-style:italic;font-size:42px;color:var(--rosa-deep)}
.section-title{font-family:'Cormorant Garamond',serif;font-weight:700;font-style:italic;font-size:28px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--black);padding-bottom:8px}
.section-title .meta{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);font-style:normal;font-weight:400}
.cal-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--black);border:1px solid var(--black);margin-bottom:64px}
.cal-card{background:#fff;padding:24px;text-decoration:none;color:var(--black);transition:background .15s,transform .15s;display:flex;flex-direction:column;gap:8px}
.cal-card:hover{background:var(--rosa)}
.cal-card .num{font-family:'Cormorant Garamond',serif;font-weight:900;font-size:64px;line-height:.85;font-style:italic;color:var(--rosa-deep)}
.cal-card .label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--grey)}
.cal-card .range{font-family:'Outfit',sans-serif;font-weight:500;font-size:16px;margin-top:4px}
.footer{border-top:1px solid var(--black);padding:24px 32px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--grey);text-align:center}
.footer a{color:var(--rosa-deep);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="logo">L U X U R</div>
      <div class="tagline">Content Operations · Calendar Hub</div>
    </div>
    <div class="year">2026</div>
  </header>

  <h2 class="section-title"><span>Calendarios Semanales</span><span class="meta">Mayo · 2026</span></h2>
  <div class="cal-list">
    <a class="cal-card" href="calendars/semana21-may19-25.html">
      <div class="num">21</div>
      <div class="label">Semana</div>
      <div class="range">Mar 19 — Lun 25 May</div>
    </a>
  </div>
</div>
<footer class="footer">
  LUXUR Content Ops · <a href="https://github.com/mpsarier-ai/luxurcontentdept" target="_blank">Repo en GitHub</a> · Live editing via Firebase
</footer>
</body>
</html>
