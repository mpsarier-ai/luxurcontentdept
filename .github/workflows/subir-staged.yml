# Sube un archivo del repo a un staged upload de Shopify (bulk operations).
# Lee email/boveda/data/upload.json: {"url":..., "file":..., "parameters":[{name,value}]}
name: subir-staged
on:
  push:
    paths: ["email/boveda/data/upload.json"]
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, subprocess
          u = json.load(open('email/boveda/data/upload.json'))
          args = ['curl', '-sS', '-o', '/dev/stdout', '-w', '\nHTTP %{http_code}\n', '-X', 'POST', u['url']]
          for p in u['parameters']:
              args += ['-F', f"{p['name']}={p['value']}"]
          args += ['-F', f"file=@{u['file']}"]
          print(subprocess.run(args, capture_output=True, text=True).stdout)
          PY
