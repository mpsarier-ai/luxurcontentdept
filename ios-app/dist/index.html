<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LUXUR Ops · sin conexión</title>
<style>
:root{--cream:#edebe6;--rosa:#f2d4d7;--black:#1a1a1a;--grey:#777}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--cream);font-family:-apple-system,BlinkMacSystemFont,'Outfit',sans-serif;color:var(--black)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:18px}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:48px;font-weight:700;letter-spacing:.12em}
h1{font-size:22px;font-weight:600}
p{font-size:15px;color:var(--grey);line-height:1.55;max-width:320px}
button{margin-top:24px;background:var(--black);color:var(--cream);border:none;font:600 14px -apple-system;letter-spacing:.14em;text-transform:uppercase;padding:14px 28px;border-radius:2px}
</style>
</head>
<body>
<div class="logo">LUXUR</div>
<h1>Sin conexión</h1>
<p>Necesitás internet para usar LUXUR Ops. Conectate a WiFi o datos móviles y volvé a abrir la app.</p>
<button onclick="location.reload()">Reintentar</button>
</body>
</html>
